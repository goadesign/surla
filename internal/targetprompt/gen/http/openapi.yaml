swagger: "2.0"
info:
    title: CP3 live target prompt operation
    description: The operation a CP3 live target serves so Surla can replace a registered prompt's text while it runs.
    version: 1.0.0
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /prompts/{prompt_id}:
        put:
            tags:
                - prompts
            summary: override_prompt prompts
            description: Replace the text of a registered prompt. The target renders the template with the prompt's registered spec before it saves it, so text that does not render is rejected and the text in use stays the same. Returns the version of the accepted text.
            operationId: prompts#override_prompt
            parameters:
                - name: prompt_id
                  in: path
                  description: Registered prompt to replace.
                  required: true
                  type: string
                  minLength: 1
                - name: override_prompt_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/PromptsOverridePromptRequestBody'
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/PromptsOverridePromptResponseBody'
                        required:
                            - prompt_id
                            - version
                "401":
                    description: 'unauthorized: Unauthorized response.'
                    schema:
                        type: string
                "404":
                    description: 'unknown_prompt: No prompt with this ID is registered.'
                    schema:
                        $ref: '#/definitions/PromptsOverridePromptUnknownPromptResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: unknown_prompt
                            temporary: false
                            timeout: false
                "422":
                    description: 'invalid_prompt: The template does not render with the prompt''s registered spec.'
                    schema:
                        $ref: '#/definitions/PromptsOverridePromptInvalidPromptResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: invalid_prompt
                            temporary: false
                            timeout: false
            schemes:
                - http
            security:
                - live_key_header_X-Live-Target-Key: []
definitions:
    PromptsOverridePromptInvalidPromptResponseBody:
        title: 'Mediatype identifier: application/vnd.goa.error; view=default'
        type: object
        properties:
            fault:
                type: boolean
                description: Is the error a server-side fault?
                example: true
            id:
                type: string
                description: ID is a unique identifier for this particular occurrence of the problem.
                example: 123abc
            message:
                type: string
                description: Message is a human-readable explanation specific to this occurrence of the problem.
                example: parameter 'p' must be an integer
            name:
                type: string
                description: Name is the name of this class of errors.
                example: bad_request
            temporary:
                type: boolean
                description: Is the error temporary?
                example: true
            timeout:
                type: boolean
                description: Is the error a timeout?
                example: false
        description: Error response result type (default view)
        example:
            fault: true
            id: 123abc
            message: parameter 'p' must be an integer
            name: bad_request
            temporary: true
            timeout: false
        required:
            - name
            - id
            - message
            - temporary
            - timeout
            - fault
    PromptsOverridePromptRequestBody:
        title: PromptsOverridePromptRequestBody
        type: object
        properties:
            template:
                type: string
                description: New prompt text, as a Go text/template.
                example: le
                minLength: 1
        example:
            template: le
    PromptsOverridePromptResponseBody:
        title: PromptsOverridePromptResponseBody
        type: object
        properties:
            prompt_id:
                type: string
                description: The prompt whose text was replaced.
                example: Corporis exercitationem esse harum est consequatur sequi.
            version:
                type: string
                description: 'Version of the accepted text: an opaque identifier that is not blank and has at most 256 characters.'
                example: mv7
                pattern: "[^ \t\n\v\f\r\N   - \L\P  　]"
                maxLength: 256
        example:
            prompt_id: Corporis exercitationem esse harum est consequatur sequi.
            version: mv7
        required:
            - prompt_id
            - version
    PromptsOverridePromptUnknownPromptResponseBody:
        title: 'Mediatype identifier: application/vnd.goa.error; view=default'
        type: object
        properties:
            fault:
                type: boolean
                description: Is the error a server-side fault?
                example: true
            id:
                type: string
                description: ID is a unique identifier for this particular occurrence of the problem.
                example: 123abc
            message:
                type: string
                description: Message is a human-readable explanation specific to this occurrence of the problem.
                example: parameter 'p' must be an integer
            name:
                type: string
                description: Name is the name of this class of errors.
                example: bad_request
            temporary:
                type: boolean
                description: Is the error temporary?
                example: true
            timeout:
                type: boolean
                description: Is the error a timeout?
                example: false
        description: Error response result type (default view)
        example:
            fault: true
            id: 123abc
            message: parameter 'p' must be an integer
            name: bad_request
            temporary: true
            timeout: false
        required:
            - name
            - id
            - message
            - temporary
            - timeout
            - fault
securityDefinitions:
    live_key_header_X-Live-Target-Key:
        type: apiKey
        description: Key Surla minted for this live target and passed to it at start.
        name: X-Live-Target-Key
        in: header

# Pushes run the short Go suites and generated-code checks in parallel.
# Nightly and manually requested runs keep every sandbox and native journey.
# All model calls use scripted providers; these jobs need no model credentials.
# Real Docker coverage requires the separate e2e,docker tags and a local engine.
name: CI

on:
  pull_request:
  push:
    # team-start is the integration branch that pull requests target until it
    # merges into main. A pull request can restore a Go cache only from its
    # own earlier runs, its base branch and main, so the base branch has to
    # run to have one; without it every pull request whose go.sum differs
    # from main's compiles from scratch. Remove team-start here when it has
    # merged into main.
    branches: [main, team-start]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

env:
  CI: "true"
  TEMPORAL_CLI_VERSION: 1.7.2
  TEMPORAL_CLI_SHA256: 561ac68bdb6c16c8e8cbbd49f12578218ff1776007c3f3ae0d0196c8c9a73e79
  # The root module's short tests take too long for one five-minute job, so
  # they run in two macOS jobs split by test name: "Go (., page tests)" runs
  # the top-level tests this pattern matches (go test -run) and "Go (.)"
  # skips exactly those (go test -skip). Every test runs in one of the two.
  # The views page and checkpoint page tests take a third to two fifths of
  # internal/controlplane's test time and are the part that grows fastest.
  ROOT_PAGE_TESTS: '^Test(ViewsPage|Checkpoint)'

jobs:
  tests:
    name: Go (${{ matrix.module }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-latest
    # A module's first run after its go.sum changes starts with no Go cache and
    # compiles every dependency with the race detector, which can take longer
    # than five minutes. The run must finish for its cache to be saved.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [., story, examples/orders, examples/orders-eval]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          # setup-go names its cache after the runner, the Go version and a
          # hash of these files, and never replaces a saved cache. Hashing this
          # module's go.sum alone keeps the generated-code job and the other
          # modules' jobs from saving the cache this job needs.
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.module == '.'
        with:
          node-version: 26.0.0
          cache: npm
          cache-dependency-path: ui/checkpoint/package-lock.json
      - name: Install the views page's test packages
        # The views page tests in internal/controlplane and internal/project
        # run the built page in jsdom; install it once before both binaries.
        if: matrix.module == '.'
        run: |
          npm ci --prefix ui/checkpoint --no-audit --no-fund </dev/null
      - name: Vet and short race tests
        # Full vet checks share the race build with tests instead of compiling
        # a separate plain build. JSON retains individual test durations.
        # In the root module, the page tests run in their own job instead,
        # and only packages that have tests are named: ./... would also
        # compile the generated packages that nothing imports, one of which
        # pulls in several hundred dependencies, and with the race detector
        # and no cache that alone took about five minutes. The Linux build
        # jobs build and vet every package of the root module, and none of
        # the packages left out here has code for one operating system.
        env:
          MODULE: ${{ matrix.module }}
          TESTED: '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}'
        run: |
          skip=
          packages=./...
          if [ "$MODULE" = . ]; then
            skip=$ROOT_PAGE_TESTS
            packages=$(go list -f "$TESTED" ./... </dev/null)
          fi
          go test -race -vet=all -short -timeout 3m -json -skip "$skip" $packages </dev/null

  pages:
    name: Go (., page tests)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          # This job builds and vets the same packages and test binaries as
          # "Go (.)", so the two share one cache and either may save it.
          cache-dependency-path: go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.0.0
          cache: npm
          cache-dependency-path: ui/checkpoint/package-lock.json
      - name: Install the views page's test packages
        run: |
          npm ci --prefix ui/checkpoint --no-audit --no-fund </dev/null
      - name: Vet and short race tests (page tests)
        # The same packages as "Go (.)": those of the root module that have
        # tests.
        env:
          TESTED: '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}'
        run: |
          packages=$(go list -f "$TESTED" ./... </dev/null)
          go test -race -vet=all -short -timeout 3m -json -run "$ROOT_PAGE_TESTS" $packages </dev/null
      - name: Vet the opt-in real-browser test
        # The views page's real-browser test builds only with the browser tag
        # and runs only on request; vetting it here keeps it compiling. This
        # step does not run it.
        run: |
          go vet -tags browser ./internal/project </dev/null

  # Every job of a push or pull request is meant to finish within five
  # minutes. The Linux checks are therefore separate jobs that run side by
  # side: one build-and-vet job per build tag, and one job for the tests.
  linux-build:
    name: Go (Linux, build ${{ matrix.tag || 'without tags' }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tag: ['', e2e, scaffold, herdr, browser, docker]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and vet
        env:
          BUILD_TAG: ${{ matrix.tag }}
        run: |
          go build -tags "$BUILD_TAG" ./... </dev/null
          go vet -tags "$BUILD_TAG" ./... </dev/null

  linux:
    name: Go (Linux, tests)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Vet and short race tests (including Linux candidate sandbox)
        # Only packages with tests are listed. The others, the generated
        # packages among them, have nothing to run, and compiling them and
        # their large dependencies with the race detector took much of this
        # job; the build-and-vet jobs above compile and vet them for Linux.
        run: |
          go test -race -vet=all -short -timeout 3m -json \
            ./cmd/surla \
            ./internal/abspath \
            ./internal/designeval \
            ./internal/diff \
            ./internal/genpublish \
            ./internal/goldenpath \
            ./internal/procgroup \
            ./internal/renameat \
            ./internal/scaffold \
            ./internal/testwriter \
            ./internal/traceview \
            ./internal/verify \
            ./internal/verifyrun \
            ./verify/candidate \
            ./verify/suite </dev/null
          go test -race -vet=all -timeout 1m -json \
            -run '^(TestCopyGrant|TestCopyEntry|TestOpenEntry)' \
            ./internal/controlplane </dev/null

  generated:
    name: Generated code and views page
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          # This job builds the generator and the views page, not the test
          # binaries. The views page's lock file is hashed with go.sum only to
          # give this job a cache name different from the root test job's.
          cache-dependency-path: |
            go.sum
            ui/checkpoint/package-lock.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.0.0
          cache: npm
          cache-dependency-path: ui/checkpoint/package-lock.json
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: Type-check and regenerate
        run: |
          npm ci --prefix ui/checkpoint --no-audit --no-fund </dev/null
          npm --prefix ui/checkpoint run typecheck </dev/null
          go run goa.design/goa/v3/cmd/goa gen github.com/goadesign/surla/design </dev/null
          go run goa.design/goa/v3/cmd/goa gen github.com/goadesign/surla/design/targetprompt -o internal/targetprompt </dev/null
          (cd examples/orders && go run goa.design/goa/v3/cmd/goa gen github.com/goadesign/surla/examples/orders/design) </dev/null
          (cd examples/orders-eval && go run goa.design/goa/v3/cmd/goa gen github.com/goadesign/surla/examples/orders-eval/design) </dev/null
          node ui/checkpoint/build.mjs --check </dev/null
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files differ from the committed ones:"
            git status --porcelain; git diff --stat; exit 1
          fi

  full:
    name: Full / ${{ matrix.suite }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # Package alarms exclude compilation and setup; job limits remain backstops.
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit-root
            module: .
            args: ./...
            test_timeout: 20m
            job_timeout: 30
          - suite: unit-orders
            module: examples/orders
            args: ./...
            test_timeout: 20m
            job_timeout: 30
          - suite: unit-story
            module: story
            args: ./...
            test_timeout: 3m
            job_timeout: 10
          - suite: unit-evaluator
            module: examples/orders-eval
            args: ./...
            test_timeout: 20m
            job_timeout: 30
          - suite: verifier
            module: .
            args: -tags=e2e ./internal/verify
            test_timeout: 20m
            job_timeout: 25
          - suite: generation
            module: .
            # The whole-journey test has its own entry, journey, below.
            args: -tags=e2e -skip '^TestWholeJourneyThroughTheProjectServer$' ./cmd/surla
            test_timeout: 40m
            job_timeout: 45
          - suite: journey
            module: .
            # One change through the project server, its team, a sandboxed
            # verification run and approval: about 2.5 to 4 minutes on a
            # developer machine with -race, several times that on this runner.
            # Its package alarm outlasts the test's own 32-minute wait for a
            # verification run, so a hung run ends with the test's message.
            args: -tags=e2e -run '^TestWholeJourneyThroughTheProjectServer$' ./cmd/surla
            test_timeout: 40m
            job_timeout: 50
          - suite: starter
            module: .
            args: -tags=scaffold ./internal/scaffold
            test_timeout: 60m
            job_timeout: 65
          - suite: orders-acceptance
            module: examples/orders-eval
            args: -tags=e2e ./acceptance
            test_timeout: 10m
            job_timeout: 15
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.suite == 'unit-root'
        with:
          node-version: 26.0.0
          cache: npm
          cache-dependency-path: ui/checkpoint/package-lock.json
      - name: Install the views page's test packages
        # Go tests never install these themselves and fail under CI without
        # them; install once before every test binary starts.
        if: matrix.suite == 'unit-root'
        run: |
          npm ci --prefix ui/checkpoint --no-audit --no-fund </dev/null
      - name: Install the Temporal CLI
        # The generation suite's Orders live-copy journey starts Temporal too.
        if: matrix.suite == 'verifier' || matrix.suite == 'generation' || matrix.suite == 'orders-acceptance'
        run: |
          archive="temporal_cli_${TEMPORAL_CLI_VERSION}_darwin_arm64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/temporalio/cli/releases/download/v${TEMPORAL_CLI_VERSION}/$archive"
          echo "${TEMPORAL_CLI_SHA256}  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" temporal
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run the full suite
        run: go test -race -count=1 -timeout ${{ matrix.test_timeout }} -json ${{ matrix.args }} </dev/null

# Temporary diagnostic for the "Starter project end to end" 30-minute budget
# on main. It runs the scaffold package once on a fresh runner with -v, so
# each test's duration and the live test's PHASE lines are visible. ci.yml is
# unchanged. Delete this workflow and the PHASE markers before any fix.
name: scaffold-phase-probe

on:
  pull_request:
    paths:
      - .github/workflows/scaffold-phase-probe.yml
      - internal/scaffold/live_integration_test.go

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Scaffold package with phase markers
        env:
          CI: "true"
        run: |
          df -k "$RUNNER_TEMP" | tail -1
          go test -count=1 -v -race -timeout 45m -tags scaffold ./internal/scaffold </dev/null
          df -k "$RUNNER_TEMP" | tail -1

    VerificationStatusResult:
        title: VerificationStatusResult
        type: object
        properties:
            accepted_at:
                type: string
                description: When the run was accepted.
                example: "1996-01-07T22:40:11Z"
                format: date-time
            candidate_commit:
                type: string
                description: Candidate commit the run builds and verifies.
                example: Molestiae totam nam nobis quidem reprehenderit quae.
            change_id:
                type: string
                description: Change Card the run verifies.
                example: Sunt ut sit omnis nobis.
            request_revision:
                type: string
                description: Change Card revision the run verifies.
                example: Enim et.
            run_id:
                type: string
                description: Verification run identifier; get_verification takes it.
                example: Quas natus.
            state:
                type: object
                description: Exactly one of running, completed or not_completed.
                example:
                    type: running
                    value:
                        started_at: "1984-04-01T02:58:45Z"
                anyOf:
                    - type: object
                      properties:
                        type:
                            type: string
                            enum:
                                - running
                        value:
                            $ref: '#/definitions/VerificationRunning'
                      required:
                        - type
                        - value
                    - type: object
                      properties:
                        type:
                            type: string
                            enum:
                                - completed
                        value:
                            $ref: '#/definitions/VerificationCompleted'
                      required:
                        - type
                        - value
                    - type: object
                      properties:
                        type:
                            type: string
                            enum:
                                - not_completed
                        value:
                            $ref: '#/definitions/VerificationNotCompleted'
                      required:
                        - type
                        - value
            suite_commit:
                type: string
                description: Evaluator suite commit the operator configured for the run.
                example: Nesciunt dolor in ea.
        description: One Checkpoint 4 verification run of a candidate commit for a confirmed Change Card revision, and its current state. The run keeps the revision it was started for, so a later confirm_intent does not change it.
        example:
            accepted_at: "1996-01-07T22:40:11Z"
            candidate_commit: Molestiae totam nam nobis quidem reprehenderit quae.
            change_id: Sunt ut sit omnis nobis.
            request_revision: Enim et.
            run_id: Quas natus.
            state:
                type: running
                value:
                    started_at: "1984-04-01T02:58:45Z"
            suite_commit: Nesciunt dolor in ea.
        required:
            - run_id
            - change_id
            - request_revision
            - candidate_commit
            - suite_commit
            - accepted_at
            - state
    VerifyChangePayload:
        title: VerifyChangePayload
        type: object
        properties:
            candidate_commit:
                type: string
                description: Full commit ID of the candidate to build and verify (40 or 64 lowercase hex characters).
                example: 4efffd1df01a87d1242013e87a6a177ab079e433
                pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
            request_revision:
                type: string
                description: Current request_revision of the confirmed Change Card.
                example: Temporibus soluta.
        example:
            candidate_commit: 4efffd1df01a87d1242013e87a6a177ab079e433
            request_revision: Temporibus soluta.
        required:
            - request_revision
            - candidate_commit

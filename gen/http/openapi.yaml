    /traces:
        get:
            tags:
                - surla
            summary: list_traces surla
            description: Read the authenticated caller's saved operation diagnostics from the control plane's private storage. Return bounded safe summaries newest first, without reading the entire file. Older pages and later refreshes work on the same running server and after restart. Recording is automatic in the project server; an embedded host must provide Options.TracerProvider when constructing its control plane. Authenticated HTTP/MCP domain calls have a surla.request.<operation> boundary span, with child domain operations recorded separately. Waiting reads are exported without being added to this private history. Requests rejected before authentication or decoding and separate verification processes are absent.
            operationId: surla#list_traces
            parameters:
                - name: status
                  in: query
                  description: all for every status, error for recorded failures, or ok for spans without an error status (including unset).
                  required: false
                  type: string
                  default: all
                  enum:
                    - all
                    - error
                    - ok
                - name: limit
                  in: query
                  description: Maximum matching spans returned; a page may contain fewer because each call scans at most 256 KiB.
                  required: false
                  type: integer
                  default: 20
                  maximum: 100
                  minimum: 1
                - name: cursor
                  in: query
                  description: Opaque next_cursor from the previous page; omit to refresh from the newest records.
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/TraceList'
                        required:
                            - spans
                            - has_more
                "403":
                    description: 'forbidden: The authenticated caller may not perform this operation or does not own the resource.'
                    schema:
                        $ref: '#/definitions/SurlaListTracesForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
                "422":
                    description: 'unprocessable: The cursor is invalid; omit it to refresh the history.'
                    schema:
                        $ref: '#/definitions/SurlaListTracesUnprocessableResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: unprocessable
                            temporary: false
                            timeout: false
                "501":
                    description: 'not_implemented: Recording is not configured; the server operator must supply controlplane.Options.TracerProvider when constructing the embedded control plane, or use the project server for automatic recording.'

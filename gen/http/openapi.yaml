swagger: "2.0"
info:
    title: Surla MCP Software Factory Control Plane
    description: MCP-native control plane for creating, verifying, and evolving production Goa-AI agentic platforms.
    version: 1.0.0
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /assignments/builder:
        get:
            tags:
                - surla
            summary: list_builder_assignments surla
            description: List the builder's assignments, one per change the user built, most recently started first, each with its change, revision and whether it was read. Reading the list records nothing.
            operationId: surla#list_builder_assignments
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/BuilderAssignmentList'
                        required:
                            - assignments
                "403":
                    description: 'forbidden: The authenticated caller may not perform this operation or does not own the resource.'
                    schema:
                        $ref: '#/definitions/SurlaListBuilderAssignmentsForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
            schemes:
                - http
    /assignments/builder/{change_id}:
        get:
            tags:
                - surla
            summary: get_builder_assignment surla
            description: Return the builder's assignment for a change in full and record that the builder read it at its revision. A new build of the change replaces the assignment, which then counts as unread.
            operationId: surla#get_builder_assignment
            parameters:
                - name: change_id
                  in: path
                  description: Change Card identifier from list_builder_assignments.
                  required: true
                  type: string
                  minLength: 1
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/BuilderAssignment'
                        required:
                            - change_id
                            - request_revision
                            - in_force
                            - read
                "403":
                    description: 'forbidden: The authenticated caller may not perform this operation or does not own the resource.'
                    schema:
                        $ref: '#/definitions/SurlaGetBuilderAssignmentForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
                "404":
                    description: 'not_found: You have no build assignment for this change_id.'
                    schema:
                        $ref: '#/definitions/SurlaGetBuilderAssignmentNotFoundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_found
                            temporary: false
                            timeout: false
            schemes:
                - http
    /assignments/test-writer:
        get:
            tags:
                - surla
            summary: list_test_writer_assignments surla
            description: List the test writer's assignments, one per change the user built, most recently started first, each with its change, revision, state and whether it was read. Reading the list records nothing.
            operationId: surla#list_test_writer_assignments
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/TestWriterAssignmentList'
                        required:
                            - assignments
                "403":
                    description: 'forbidden: The authenticated caller may not perform this operation or does not own the resource.'
                    schema:
                        $ref: '#/definitions/SurlaListTestWriterAssignmentsForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
            schemes:
                - http
    /assignments/test-writer/{change_id}:
        get:
            tags:
                - surla
            summary: get_test_writer_assignment surla
            description: Return the test writer's assignment for a change in full (the working folder, the Story as agreed at the built revision, the tests it requires, and the state with any findings) and record that the test writer read it at its revision. A new build of the change replaces the assignment, which then counts as unread.
            operationId: surla#get_test_writer_assignment
            parameters:
                - name: change_id
                  in: path
                  description: Change Card identifier from list_test_writer_assignments.
                  required: true
                  type: string
                  minLength: 1
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/TestWriterAssignment'
                        required:
                            - change_id
                            - request_revision
                            - in_force
                            - progress
                            - working_folder
                            - stories
                            - required_tests
                "403":
                    description: 'forbidden: The authenticated caller may not perform this operation or does not own the resource.'
                    schema:
                        $ref: '#/definitions/SurlaGetTestWriterAssignmentForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
                "404":
                    description: 'not_found: You have no test assignment for this change_id.'
                    schema:
                        $ref: '#/definitions/SurlaGetTestWriterAssignmentNotFoundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_found
                            temporary: false
                            timeout: false
            schemes:
                - http
    /assignments/test-writer/{change_id}/finished:
        post:
            tags:
                - surla
            summary: report_tests_finished surla
            description: 'The test writer reports that its tests for a change at the build''s revision are finished. Surla only records the report: the assignment''s state becomes reported from any state, earlier findings or a recorded commit are cleared, and the tests are not checked. A report for another revision is refused and changes nothing.'
            operationId: surla#report_tests_finished
            parameters:
                - name: change_id
                  in: path
                  description: Change Card identifier from your test assignment.
                  required: true
                  type: string
                  minLength: 1
                - name: report_tests_finished_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/SurlaReportTestsFinishedRequestBody'
                    required:
                        - request_revision
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/TestWriterAssignmentItem'
                        required:
                            - change_id
                            - request_revision
                            - in_force
                            - progress
                "403":
                    description: 'forbidden: The authenticated caller may not perform this operation or does not own the resource.'
                    schema:
                        $ref: '#/definitions/SurlaReportTestsFinishedForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
                "404":
                    description: 'not_found: You have no test assignment for this change_id.'
                    schema:
                        $ref: '#/definitions/SurlaReportTestsFinishedNotFoundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_found
                            temporary: false
                            timeout: false
                "409":
                    description: 'conflict: request_revision is not the revision of your test assignment; read it again with get_test_writer_assignment. Nothing changed.'
                    schema:
                        $ref: '#/definitions/SurlaReportTestsFinishedConflictResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: conflict
                            temporary: false
                            timeout: false
            schemes:
                - http
    /change-updates:
        get:
            tags:
                - surla
            summary: wait_for_changes surla
            description: Return the current change list's version as soon as it differs from since, the version of the list the caller last read, or after a bounded wait of a few seconds when nothing changed. The version also changes when the owner's Story evaluation starts, finishes or is replaced. The views page keeps one such read open and, only when the version changed, calls list_changes again and, while it shows the Story, get_story_refresh. Each call is traced but never saved in the diagnostics history list_traces reads, so an open page does not push real operations out of view.
            operationId: surla#wait_for_changes
            parameters:
                - name: since
                  in: query
                  description: version of the change list the caller last read.
                  required: true
                  type: string
                  maxLength: 128
                  minLength: 1
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ChangeListVersion'
                        required:
                            - version
                "403":
                    description: 'forbidden: The authenticated caller may not perform this operation or does not own the resource.'
                    schema:
                        $ref: '#/definitions/SurlaWaitForChangesForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
            schemes:
                - http
    /changes:
        get:
            tags:
                - surla
            summary: list_changes surla
            description: List the owner's saved Change Cards for this project, most recently saved first, with each card's summary, status, current request_revision, the state of its most recently accepted verification run, and when it was last saved, and say whether this server can record approvals. The views page opens on this list; agents use it to find a change_id. Reading changes nothing.
            operationId: surla#list_changes
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ChangeList'
                        required:
                            - changes
                            - version
                            - approval_available
                "403":
                    description: 'forbidden: The authenticated caller may not perform this operation or does not own the resource.'
                    schema:
                        $ref: '#/definitions/SurlaListChangesForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
            schemes:
                - http
    /changes/{change_id}:
        get:
            tags:
                - surla
            summary: get_change surla
            description: Return the current Change Card, including its request_revision, to its owner, for example after confirm_intent or revise_change refused an edit made against an older revision. Reading never confirms or changes the card. A recorded approval is returned in approval only while it still matches the promotion target's current suite, environment and binary digests, or in unverified_approval when no promotion target is configured or the target cannot report its current inputs.
            operationId: surla#get_change
            parameters:
                - name: change_id
                  in: path
                  description: Change identifier.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ChangeCardResult'
                        required:
                            - change_id
                            - status
                            - prompt
                            - summary
                            - examples
                            - preserved_behaviors
                            - request_revision
                "403":
                    description: 'forbidden: The authenticated caller may not perform this operation or does not own the resource.'
                    schema:
                        $ref: '#/definitions/SurlaGetChangeForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
                "404":
                    description: 'not_found: No Change Card exists with this change_id.'
                    schema:
                        $ref: '#/definitions/SurlaGetChangeNotFoundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_found
                            temporary: false
                            timeout: false
            schemes:
                - http
    /changes/{change_id}/build:
        get:
            tags:
                - surla
            summary: get_build surla
            description: 'Return a change''s build: not_started until the user starts one; otherwise the revision built, when, whether the builder read its assignment, the test writer''s state and whether it read its assignment, and whether the build is for the change''s revision in force. Reading changes nothing.'
            operationId: surla#get_build
            parameters:
                - name: change_id
                  in: path
                  description: Change Card identifier.
                  required: true
                  type: string
                  minLength: 1
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ChangeBuild'
                        required:
                            - change_id
                            - build
                "403":
                    description: 'forbidden: The authenticated caller may not perform this operation or does not own the resource.'
                    schema:
                        $ref: '#/definitions/SurlaGetBuildForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
                "404":
                    description: 'not_found: No Change Card exists with this change_id.'
                    schema:
                        $ref: '#/definitions/SurlaGetBuildNotFoundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_found
                            temporary: false
                            timeout: false
            schemes:
                - http
        post:
            tags:
                - surla
            summary: start_build surla
            description: The user starts building a confirmed change at its revision in force. Surla saves the build with the Story as agreed at that revision and assigns the build to the builder and the test writer. Building again replaces the build and both assignments, which then count as unread. A change that is not confirmed, or a request_revision that is not the one in force, is refused and nothing changes.
            operationId: surla#start_build
            parameters:
                - name: change_id
                  in: path
                  description: Confirmed Change Card identifier.
                  required: true
                  type: string
                  minLength: 1
                - name: start_build_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/SurlaStartBuildRequestBody'
                    required:
                        - request_revision
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/StartedBuild'
                        required:
                            - request_revision
                            - started_at
                            - in_force
                            - builder
                            - test_writer
                "403":
                    description: 'forbidden: The authenticated caller may not perform this operation or does not own the resource.'
                    schema:
                        $ref: '#/definitions/SurlaStartBuildForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
                "404":
                    description: 'not_found: No Change Card exists with this change_id.'
                    schema:
                        $ref: '#/definitions/SurlaStartBuildNotFoundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_found
                            temporary: false
                            timeout: false
                "409":
                    description: 'conflict: The Change Card is not confirmed or request_revision is not its revision in force; nothing changed.'
                    schema:
                        $ref: '#/definitions/SurlaStartBuildConflictResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: conflict
                            temporary: false
                            timeout: false
                "422":
                    description: 'unprocessable: The agreed Story has a finished flow whose key gives its required test an empty name, or two finished flows whose required tests would have the same name; revise the Story. Nothing changed.'
                    schema:
                        $ref: '#/definitions/SurlaStartBuildUnprocessableResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: unprocessable
                            temporary: false
                            timeout: false
            schemes:
                - http
    /changes/{change_id}/verifications:
        get:
            tags:
                - surla
            summary: list_verifications surla
            description: Return all Checkpoint 4 verification runs started by the owner for a Change Card, ordered newest first by accepted_at (tie-broken by run_id), with each run's current state and the Change Card revision it was started for. Works whether the Change Card is currently confirmed or in needs_confirmation after a later revision.
            operationId: surla#list_verifications
            parameters:
                - name: change_id
                  in: path
                  description: Change Card identifier.
                  required: true
                  type: string
                  minLength: 1
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/VerificationListResult'
                        required:
                            - change_id
                            - runs
                "403":
                    description: 'forbidden: The authenticated caller may not perform this operation or does not own the resource.'
                    schema:
                        $ref: '#/definitions/SurlaListVerificationsForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
                "404":
                    description: 'not_found: No Change Card exists with this change_id.'
                    schema:
                        $ref: '#/definitions/SurlaListVerificationsNotFoundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_found
                            temporary: false
                            timeout: false
                "501":
                    description: 'not_implemented: This server has no verification configuration, so it cannot list verification runs.'
                    schema:
                        $ref: '#/definitions/SurlaListVerificationsNotImplementedResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_implemented
                            temporary: false
                            timeout: false
            schemes:
                - http
        post:
            tags:
                - surla
            summary: verify_change surla
            description: Start Checkpoint 4 verification of a candidate commit for the owner's confirmed Change Card revision and return its run_id at once. The server builds the commit in Surla's sandbox and runs the evaluator suite the operator configured, in a separate process that keeps running when the caller disconnects or the server restarts; get_verification reads its state. Only the builder view of the report is ever returned. Requires a committed starter project in the bound workspace or verification settings installed with surla verification set.
            operationId: surla#verify_change
            parameters:
                - name: change_id
                  in: path
                  description: Confirmed Change Card identifier.
                  required: true
                  type: string
                - name: verify_change_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/VerifyChangePayload'
                    required:
                        - request_revision
                        - candidate_commit
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/VerificationStatusResult'
                        required:
                            - run_id
                            - change_id
                            - request_revision
                            - candidate_commit
                            - suite_commit
                            - accepted_at
                            - state
                "403":
                    description: 'forbidden: The authenticated caller may not perform this operation or does not own the resource.'
                    schema:
                        $ref: '#/definitions/SurlaVerifyChangeForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
                "404":
                    description: 'not_found: No Change Card exists with this change_id.'
                    schema:
                        $ref: '#/definitions/SurlaVerifyChangeNotFoundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_found
                            temporary: false
                            timeout: false
                "409":
                    description: 'conflict: The Change Card is not confirmed or its request_revision does not match; confirm the card or read the current revision with get_change.'
                    schema:
                        $ref: '#/definitions/SurlaVerifyChangeConflictResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: conflict
                            temporary: false
                            timeout: false
                "501":
                    description: 'not_implemented: This server has no verification configuration, so it cannot run Checkpoint 4 verifications.'
                    schema:
                        $ref: '#/definitions/SurlaVerifyChangeNotImplementedResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_implemented
                            temporary: false
                            timeout: false
            schemes:
                - http
    /changes/approve:
        post:
            tags:
                - surla
            summary: approve_merge surla
            description: Record Checkpoint 5 approval for the owner's confirmed Change Card revision. The control plane loads the verification report by digest and the expected suite, environment and candidate binary digests from its promotion target, re-derives the report from its evidence with verify.Approve, and records the approval on the card. A report that did not pass or describes different inputs is rejected. Nothing is merged or deployed. The promotion target comes from surla promotion set or from the program that embeds the control plane; a control plane without one rejects every call.
            operationId: surla#approve_merge
            parameters:
                - name: approve_merge_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ApproveMergePayload'
                    required:
                        - change_id
                        - request_revision
                        - candidate_commit
                        - report_digest
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ChangeCardResult'
                        required:
                            - change_id
                            - status
                            - prompt
                            - summary
                            - examples
                            - preserved_behaviors
                            - request_revision
                "403":
                    description: 'forbidden: The authenticated caller may not perform this operation or does not own the resource.'
                    schema:
                        $ref: '#/definitions/SurlaApproveMergeForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
                "404":
                    description: 'not_found: No Change Card exists with this change_id.'
                    schema:
                        $ref: '#/definitions/SurlaApproveMergeNotFoundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_found
                            temporary: false
                            timeout: false
                "409":
                    description: 'conflict: The Change Card is not confirmed or its request_revision does not match; confirm the card or read the current revision with get_change.'
                    schema:
                        $ref: '#/definitions/SurlaApproveMergeConflictResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: conflict
                            temporary: false
                            timeout: false
                "422":
                    description: 'unprocessable: The verification report did not pass or does not match the Change Card and promotion target inputs.'
                    schema:
                        $ref: '#/definitions/SurlaApproveMergeUnprocessableResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: unprocessable
                            temporary: false
                            timeout: false
                "501":
                    description: 'not_implemented: This control plane has no promotion target bound to it.'
                    schema:
                        $ref: '#/definitions/SurlaApproveMergeNotImplementedResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_implemented
                            temporary: false
                            timeout: false
            schemes:
                - http
    /changes/confirm:
        post:
            tags:
                - surla
            summary: confirm_intent surla
            description: Confirm or refine a Checkpoint 1 Change Card with the complete ambiguity answers and example table, bound to its current request_revision. Changed answers or examples produce a new request_revision; unchanged ones return the card as it is, with a saved approval returned in approval only while that approval still matches the promotion target's current inputs, or in unverified_approval when no promotion target is configured or the target cannot report its current inputs. To record a decision that no option expresses, call revise_change with that decision in prompt.
            operationId: surla#confirm_intent
            parameters:
                - name: confirm_intent_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ConfirmIntentPayload'
                    required:
                        - change_id
                        - request_revision
                        - answers
                        - examples
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ChangeCardResult'
                        required:
                            - change_id
                            - status
                            - prompt
                            - summary
                            - examples
                            - preserved_behaviors
                            - request_revision
                "403":
                    description: 'forbidden: The authenticated caller may not perform this operation or does not own the resource.'
                    schema:
                        $ref: '#/definitions/SurlaConfirmIntentForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
                "404":
                    description: 'not_found: No Change Card exists with this change_id.'
                    schema:
                        $ref: '#/definitions/SurlaConfirmIntentNotFoundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_found
                            temporary: false
